<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BOM</title>
    <!-- FONT AWESOME -->
    <script
      src="https://kit.fontawesome.com/77cc922ec4.js"
      crossorigin="anonymous"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style type="text/tailwindcss">
      @layer components {
        .background-image {
          @apply bg-cover bg-center rounded-xl h-64;
          background-image: url(https://images.unsplash.com/photo-1557858310-9052820906f7?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-slate-100 px-4 py-10 min-h-screen">
      <div
        class="bg-white shadow-xl mx-auto border border-slate-200 rounded-2xl w-full max-w-4xl overflow-hidden"
      >
        <div class="grid md:grid-cols-2">
          <!-- Advertisement content -->
          <div class="flex flex-col justify-center p-8 md:p-10">
            <div class="flex items-center gap-4 mb-6">
              <div
                class="flex justify-center items-center bg-blue-100 rounded-full size-12 shrink-0"
              >
                <i class="text-blue-800 text-2xl fa-regular fa-bell"></i>
              </div>

              <div>
                <p class="mb-1 font-medium text-blue-600 text-sm">
                  Advertisement
                </p>

                <h2 class="font-bold text-slate-800 text-2xl">
                  Trang quảng cáo
                </h2>
              </div>
            </div>

            <p class="mb-6 text-slate-600 leading-7">
              Cảm ơn bạn đã quan tâm đến sản phẩm của chúng tôi.
            </p>

            <!-- Campaign information -->
            <div class="space-y-3 bg-slate-50 mb-6 p-4 rounded-xl">
              <div>
                <p class="text-slate-500 text-sm">Nguồn quảng cáo</p>

                <p id="sourceElement" class="font-semibold text-slate-800">
                  Đang tải...
                </p>
              </div>

              <div>
                <p class="text-slate-500 text-sm">Chiến dịch</p>

                <p id="campaignElement" class="font-semibold text-slate-800">
                  Đang tải...
                </p>
              </div>
            </div>

            <button
              id="return-button"
              class="bg-white hover:bg-gray-100 shadow-sm hover:shadow-md mt-5 px-4 py-2 border border-gray-300 rounded-lg font-medium text-gray-700 text-sm active:scale-95 transition cursor-pointer"
            >
              Return To Home
            </button>
          </div>

          <!-- Advertisement image -->
          <div class="h-64 md:h-auto">
            <img
              src="https://images.unsplash.com/photo-1557858310-9052820906f7?q=80&w=2070&auto=format&fit=crop"
              alt="Advertisement"
              class="w-full h-full object-cover"
            />
          </div>
        </div>
      </div>
    </div>
    <script src="./campaign.js"></script>
  </body>
</html>
